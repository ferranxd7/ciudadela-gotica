name: Audios de ElevenLabs

on:
  push:
    branches: [main]
    paths: ['ci/eleven/descargas.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bajar los audios (los enlaces caducan a las 00:00 UTC)
        run: python3 ci/eleven/bajar.py | tee eleven_informe.txt
      - name: Guardar los masters en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/eleven/master
          if git diff --cached --quiet; then echo "nada nuevo"; exit 0; fi
          git commit -m "Audios de ElevenLabs descargados (masters)"
          for i in 1 2 3 4; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 7; done
