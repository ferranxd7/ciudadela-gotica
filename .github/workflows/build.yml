name: Compilar y probar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Compilar el mod
        run: gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Prueba de generacion en un servidor
        if: success()
        run: |
          mkdir -p run/ci-out
          echo "eula=true" > run/eula.txt
          printf "level-seed=ciudadela\nonline-mode=false\nspawn-protection=0\nmax-tick-time=-1\nview-distance=4\nsimulation-distance=4\n" > run/server.properties
          CIUDADELA_CI=1 timeout 50m gradle runServer --no-daemon 2>&1 | tee server.log || true
          grep -nE "Error construyendo|Exception|\[CI\]|ERROR" server.log | head -300 > run/ci-out/errores.txt || true

      - name: Publicar resultados
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: |
            build/libs/*.jar
            build.log
            server.log
            run/ci-out/*
