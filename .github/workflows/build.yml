name: Compilar y probar

on:
  push:
    branches: [main]
    paths-ignore: ['ci/voces/**', '.github/workflows/voces.yml', 'ci/eleven/descargas.json', 'ci/eleven/sesiones.json', '.github/workflows/eleven.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORGE: 1.20.1-47.3.0
  MODS: >-
    macaws-furniture macaws-roofs macaws-windows macaws-lights-and-lamps macaws-paths-and-pavings
    macaws-bridges macaws-fences-and-walls macaws-doors macaws-trapdoors macaws-stairs
    handcrafted supplementaries another-furniture biomes-o-plenty

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 176
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/cache@v4
        with:
          path: |
            piper
            narr_tmp/*.onnx
            narr_tmp/*.onnx.json
          key: piper-${{ hashFiles('ci/narracion/voz.txt') }}

      - uses: actions/cache@v4
        with:
          path: musica_dl
          key: musica-${{ hashFiles('ci/musica/pistas.json') }}
          restore-keys: |
            musica-

      - name: Musica (licencias libres, con creditos)
        run: |
          mkdir -p out
          python3 ci/musica/bajar.py musica_dl src/main/resources/assets/darkcraft/sounds out || echo "AVISO: musica" >> out/musica.log
          for f in src/main/resources/assets/darkcraft/sounds/musica/*.ogg; do [ -f "$f" ] && cp "$f" "out/musica_$(basename "$f")"; done
          cat out/musica.log || true

      - name: Textos, narraciones de los capitulos 1, 5 y 6 y audios de ElevenLabs
        run: |
          mkdir -p out
          python3 ci/historia/textos.py > out/textos.log 2>&1 || echo "AVISO: revisar textos" >> out/textos.log
          bash ci/narracion/generar.sh 2>&1 | tee out/narracion.log || true
          python3 ci/eleven/procesar.py 2>&1 | tee out/eleven_audios.log || true
          for f in src/main/resources/assets/darkcraft/sounds/rey/voz_*.ogg; do [ -f "$f" ] && cp "$f" "out/rey_$(basename "$f")"; done
          for f in src/main/resources/assets/darkcraft/sounds/sfx/*_1.ogg; do [ -f "$f" ] && cp "$f" "out/sfx_$(basename "$f")"; done
          cp src/main/resources/assets/darkcraft/sounds/narracion/cap1.ogg out/narracion_capitulo1.ogg 2>/dev/null || true
          cp src/main/resources/assets/darkcraft/sounds/narracion/cap5.ogg out/narracion_capitulo5.ogg 2>/dev/null || true
          cp src/main/resources/assets/darkcraft/sounds/narracion/cap6.ogg out/narracion_capitulo6.ogg 2>/dev/null || true

      - name: Compilar el mod
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Distant Horizons, Oculus y Embeddium dentro del jar (y el shader para el instalador)
        run: |
          set -o pipefail
          mkdir -p out
          python3 ci/dentro/meter.py build/libs/darkcraft-0.1.0.jar ci/dentro/mods.json out 2>&1 | tee out/mods_dentro.txt

      - name: Firmas de la API (para programar)
        if: always()
        run: bash ci/firmas.sh > out/firmas.txt 2>&1 || true

      - name: Classpath para compilar en local
        if: always() && contains(github.event.head_commit.message, '[cp]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CP=$(gradle -q rutaClases --no-daemon 2>/dev/null | grep '^CP=' | cut -c4-)
          mkdir -p cpjars
          IFS=':' read -ra J <<< "$CP"
          for j in "${J[@]}"; do [ -f "$j" ] && cp -n "$j" cpjars/; done
          tar czf classpath.tgz cpjars
          ls -la classpath.tgz
          gh release view classpath >/dev/null 2>&1 || gh release create classpath --title "classpath" --notes "jars para compilar" --prerelease --latest=false
          gh release upload classpath classpath.tgz --clobber
        continue-on-error: true

      - name: Preparar servidor Forge real
        run: |
          mkdir -p srv out
          curl -sL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE}/forge-${FORGE}-installer.jar"
          (cd srv && java -jar ../installer.jar --installServer > ../out/installer.log 2>&1)
          echo "eula=true" > srv/eula.txt
          printf "level-seed=ciudadela\nonline-mode=false\nspawn-protection=0\nmax-tick-time=-1\nview-distance=4\nsimulation-distance=4\n" > srv/server.properties

      - name: Prueba con mods de decoracion
        run: |
          python3 ci/download_mods.py srv/mods $MODS || true
          cp out/../srv/mods_descargados.txt out/ 2>/dev/null || cp srv/mods_descargados.txt out/ || true
          cp build/libs/darkcraft-*.jar srv/mods/
          python3 ci/make_mrpack.py srv/mrpack_files.json build/libs/darkcraft-0.1.0.jar out/DarkCraft-modpack.mrpack "${FORGE#1.20.1-}" out/shader.json
          python3 ci/instalador.py srv/mrpack_files.json out/shader.json out/instalar_mods.bat || true
          echo "-Xmx6G -Ddarkcraft.ciTest=true" > srv/user_jvm_args.txt
          (cd srv && timeout 50m ./run.sh nogui 2>&1 | tee ../out/server_mods.log) || true
          mkdir -p out/mods && cp -r srv/ci-out/* out/mods/ 2>/dev/null || true
          grep -nE "Error construyendo|Exception|\[CI\]" out/server_mods.log | head -300 > out/mods/errores.txt || true

      - name: Prueba sin mods (solo vanilla)
        run: |
          mkdir -p srv2
          cp -r srv/libraries srv/run.sh srv/user_jvm_args.txt srv/eula.txt srv/server.properties srv2/ 2>/dev/null || true
          cp srv/*.jar srv2/ 2>/dev/null || true
          mkdir -p srv2/mods && cp build/libs/darkcraft-*.jar srv2/mods/
          (cd srv2 && timeout 40m ./run.sh nogui 2>&1 | tee ../out/server_vanilla.log) || true
          mkdir -p out/vanilla && cp -r srv2/ci-out/* out/vanilla/ 2>/dev/null || true
          grep -nE "Error construyendo|Exception" out/server_vanilla.log | head -100 > out/vanilla/errores.txt || true

      - uses: actions/cache@v4
        with:
          path: ~/.pmc
          key: pmc-${{ env.FORGE }}-v1

      - name: Prueba del cliente (capturas y sonido grabado)
        timeout-minutes: 128
        run: |
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils python3-numpy python3-pil python3-venv > /dev/null 2>&1 || true
          # el juego de verdad con el jar de la release (DH, Oculus y Embeddium dentro); si no entra, en desarrollo
          bash ci/cliente/lanzar.sh "$FORGE" build/libs/darkcraft-0.1.0.jar
          cp run/ci-cliente/* out/ 2>/dev/null || true
          python3 ci/cliente/hoja.py run/screenshots out || true
          for f in run/screenshots/cliente_*.png; do [ -f "$f" ] && cp "$f" out/; done
          python3 ci/cliente/audio.py out/audio_cliente.wav src/main/resources/assets/darkcraft/sounds out > out/audio_cliente.txt 2>&1 || true
          rm -f out/audio_cliente.wav
          grep -nE "\[CI cliente\]|Exception|ERROR|OpenAL|Sound" out/cliente_latest.log out/cliente.log 2>/dev/null | head -300 > out/cliente_resumen.txt || true
          tail -50 out/audio_cliente.txt || true

      - name: Publicar resultados
        if: always()
        run: |
          cd out
          for f in mods/*; do [ -f "$f" ] && mv "$f" "mods_$(basename "$f")"; done
          for f in vanilla/*; do [ -f "$f" ] && mv "$f" "vanilla_$(basename "$f")"; done
          ls -la
        continue-on-error: true

      - name: Subir release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICAR: ${{ contains(github.event.head_commit.message, '[publicar]') && 'si' || 'no' }}
        run: |
          shopt -s nullglob
          # el instalador antiguo baja ciudadela-0.1.0.jar: se sube tambien con ese nombre (es el mismo mod)
          [ -f build/libs/darkcraft-0.1.0.jar ] && cp build/libs/darkcraft-0.1.0.jar out/ciudadela-0.1.0.jar
          # las capturas y los audios van en dos zip (subir cientos de ficheros sueltos choca con el limite de GitHub)
          (cd out && pngs=(*.png) && [ ${#pngs[@]} -gt 0 ] && zip -q -0 capturas.zip "${pngs[@]}") || true
          (cd out && oggs=() && for f in *.ogg; do [ "$f" != "audio_cliente.ogg" ] && oggs+=("$f"); done && [ ${#oggs[@]} -gt 0 ] && zip -q -0 audios.zip "${oggs[@]}") || true
          files=()
          for f in build/libs/*.jar out/*.jar build.log out/*.txt out/*.log out/capturas.zip out/audios.zip out/audio_cliente.ogg out/*.mrpack out/instalar_mods.bat; do [ -s "$f" ] && files+=("$f"); done
          # si es un reintento, la version que dejo el intento fallido anterior se sustituye
          gh release delete "build-${{ github.run_number }}" --yes >/dev/null 2>&1 || true
          if ls build/libs/*.jar >/dev/null 2>&1 && grep -q "^OK" out/mods_informe.txt 2>/dev/null && [ "$PUBLICAR" = "si" ]; then
            { echo "Version automatica ${{ github.run_number }}. Se instala con instalar_mods.bat (en esta pagina)."; echo; echo '```'; cat out/creditos_mods.txt 2>/dev/null; echo '```'; } > out/notas.md
            gh release create "build-${{ github.run_number }}" "${files[@]}" --title "Dark Craft - Build ${{ github.run_number }}" --notes-file out/notas.md --latest
          elif ls build/libs/*.jar >/dev/null 2>&1 && grep -q "^OK" out/mods_informe.txt 2>/dev/null; then
            gh release create "build-${{ github.run_number }}" "${files[@]}" --title "Build ${{ github.run_number }} (en desarrollo)" --notes "Version de pruebas: no es la que se instala" --prerelease --latest=false
          else
            gh release create "build-${{ github.run_number }}" "${files[@]}" --title "Build ${{ github.run_number }} (fallida)" --notes "Compilacion o prueba fallida" --prerelease --latest=false
          fi
