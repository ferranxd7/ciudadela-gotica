mod_description=Dark Craft: el Reino de Valdrenn, un reino maldito sobre una isla flotante de 800x800 bloques, con sus jefes, su historia y sus secretos.\n\nM\u00fasica con licencia libre: Alexandr Zhelanov (CC-BY 4.0), Phil\u00e9mon Weber - Helmet (CC-BY 4.0), Matthew Pablo (CC-BY 3.0), \u0130lker Yal\u00e7\u0131ner (CC-BY 4.0). Detalles en assets/darkcraft/creditos.txt\n\nLleva dentro, sin cambios, Distant Horizons, Oculus y Embeddium (software libre, LGPL-3.0; codigo fuente y licencias en META-INF/darkcraft/ del jar). Shaders: Complementary Unbound de EminGT (complementary.dev), que baja el instalador.
